[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -m "not eval"
markers =
    eval: slow retrieval-quality evaluation that calls the embedding API (run with -m eval)
pythonpath = .
filterwarnings =
    ignore::DeprecationWarning:PyPDF2.*
    ignore::pytest.PytestRemovedIn9Warning
